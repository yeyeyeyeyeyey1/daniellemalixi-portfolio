<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danielle Angelo Malixi — AI Automation & GoHighLevel Specialist</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #0a0a0a;
      --text-soft: #4a4a4a;
      --text-muted: #888888;
      --line: #e5e5e5;
      --accent: #0a0a0a;
      --accent-soft: #f0f0f0;
      --accent-dark: #000000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .serif { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; }
    a { color: inherit; }

    /* ===== NAV ===== */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(250, 250, 247, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s ease;
    }
    .nav.scrolled { border-bottom-color: var(--line); }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      padding: 1.1rem 2rem;
      display: flex; justify-content: flex-end; align-items: center;
    }
    .nav-logo {
      font-size: 1.15rem; font-weight: 700;
      color: var(--text); text-decoration: none;
      letter-spacing: -0.02em;
    }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      font-size: 0.92rem; font-weight: 500;
      color: var(--text-soft); text-decoration: none;
      transition: color 0.2s ease;
      padding: 0.3rem 0;
      position: relative;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--accent); }
    .nav-links a.active::after {
      content: ''; position: absolute;
      left: 0; right: 0; bottom: -2px;
      height: 2px; background: var(--accent); border-radius: 2px;
    }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

    /* ===== HERO ===== */
    .hero {
      min-height: 100vh;
      display: flex; align-items: center;
      padding: 7rem 2rem 4rem;
      max-width: 1100px; margin: 0 auto;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 4rem;
      align-items: center;
      width: 100%;
    }
    @media (max-width: 820px) {
      .hero-grid { grid-template-columns: 1fr; gap: 2.5rem; text-align: center; }
      .hero-photo-wrap { order: -1; max-width: 280px; margin: 0 auto; }
    }
    .hero-tag {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--accent-soft);
      color: var(--accent-dark);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.82rem; font-weight: 600;
      margin-bottom: 1.5rem;
      opacity: 0; animation: rise 0.8s ease 0.1s forwards;
    }
    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 1.2rem;
      opacity: 0; animation: rise 0.9s ease 0.25s forwards;
    }
    .hero h1 .accent { color: var(--accent); }
    .hero-role {
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      color: var(--text-soft);
      margin-bottom: 1.5rem;
      font-weight: 500;
      opacity: 0; animation: rise 0.9s ease 0.4s forwards;
    }
    .hero-desc {
      font-size: 1.05rem;
      color: var(--text-soft);
      margin-bottom: 2.2rem;
      line-height: 1.75;
      max-width: 32rem;
      opacity: 0; animation: rise 0.9s ease 0.55s forwards;
    }
    .hero-actions {
      display: flex; flex-wrap: wrap; gap: 0.8rem;
      opacity: 0; animation: rise 0.9s ease 0.7s forwards;
    }
    @media (max-width: 820px) {
      .hero-actions { justify-content: center; }
    }
    .btn {
      font-size: 0.95rem; font-weight: 600;
      padding: 0.85rem 1.6rem;
      text-decoration: none;
      border-radius: 999px;
      transition: all 0.25s ease;
      display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.3); }
    .btn-ghost {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

    /* Profile photo */
    .hero-photo-wrap {
      position: relative;
      opacity: 0; animation: rise 1s ease 0.3s forwards;
    }
    .hero-photo {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 20%;
      background: var(--accent-soft);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.15);
    }
    .hero-photo-deco {
      position: absolute;
      inset: -12px;
      border: 2px dashed var(--accent);
      border-radius: 50%;
      opacity: 0.5;
      animation: spin 30s linear infinite;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== SECTIONS ===== */
    .section { padding: 6rem 0; }
    .section-alt { background: #fff; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }
    .section-eyebrow {
      display: inline-block;
      color: #2563eb;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }
    .section-title {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .section-title em { font-style: normal; color: var(--accent); }
    .section-sub {
      color: var(--text-soft);
      font-size: 1.05rem;
      max-width: 36rem;
      margin: 1rem auto 0;
    }

    /* ===== ABOUT ===== */
    .about-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 3rem;
      align-items: start;
    }
    @media (max-width: 820px) { .about-grid { grid-template-columns: 1fr; gap: 2rem; } }
    .about-text p {
      color: var(--text-soft);
      font-size: 1.05rem;
      margin-bottom: 1.2rem;
      line-height: 1.8;
    }
    .about-text strong { color: var(--text); font-weight: 600; }
    .quickfacts {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 2rem;
    }
    .quickfacts h4 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      font-weight: 600;
    }
    .fact-row {
      display: flex; justify-content: space-between;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.95rem;
    }
    .fact-row:last-child { border-bottom: none; }
    .fact-row .key { color: var(--text-muted); }
    .fact-row .val { color: var(--text); font-weight: 500; text-align: right; }

    /* ===== EXPERIENCE / EDUCATION ===== */
    .cards { display: grid; gap: 1.2rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 2rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.1);
      border-color: var(--accent);
    }
    .card-head {
      display: flex; justify-content: space-between;
      flex-wrap: wrap; gap: 0.5rem;
      margin-bottom: 0.3rem;
    }
    .card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }
    .card .when {
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 600;
      background: var(--accent-soft);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .card .where {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-weight: 500;
    }
    .card ul { list-style: none; }
    .card li {
      color: var(--text-soft);
      font-size: 0.96rem;
      padding: 0.3rem 0 0.3rem 1.4rem;
      position: relative;
      line-height: 1.6;
    }
    .card li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #16a34a;
      font-weight: 700;
    }

    /* ===== SKILLS ===== */
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.2rem;
    }
    .skill-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.8rem;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .skill-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .skill-icon {
      width: 56px; height: 56px;
      background: var(--accent-soft);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin-bottom: 1.2rem;
      line-height: 1;
    }
    .skill-card h4 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }
    .skill-card ul { list-style: none; }
    .skill-card li {
      color: var(--text-soft);
      font-size: 0.92rem;
      padding: 0.3rem 0;
    }
    .skill-card li::before {
      content: '— ';
      color: var(--accent);
    }

    /* ===== PORTFOLIO ===== */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .design-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .design-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.15);
    }
    .design-img-wrap {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--accent-soft);
    }
    .design-img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .design-card:hover .design-img { transform: scale(1.05); }
    .design-info {
      padding: 1.3rem 1.5rem;
    }
    .design-info h4 {
      font-size: 1.1rem; font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .design-info p {
      font-size: 0.88rem; color: var(--text-muted);
    }
    /* Modal */
    .modal {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(20, 20, 20, 0.85);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
      animation: fadein 0.25s ease;
    }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .modal img {
      max-width: 90vw; max-height: 88vh;
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    }
    .modal-close {
      position: absolute; top: 1.5rem; right: 1.5rem;
      background: #fff; color: var(--text);
      width: 44px; height: 44px;
      border: none; border-radius: 50%;
      cursor: pointer; font-size: 1.4rem;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s ease;
    }
    .modal-close:hover { transform: rotate(90deg) scale(1.1); }


    /* ===== AUTOMATIONS ===== */
    .auto-featured {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 3rem;
      box-shadow: 0 20px 50px -35px rgba(0, 0, 0, 0.4);
    }
    .auto-featured-head {
      background: #0a0a0a;
      color: #fff;
      padding: 2.6rem 2.4rem 2.2rem;
    }
    .auto-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 0.4rem 0.8rem; border-radius: 999px;
      margin-bottom: 1.1rem;
    }
    .auto-featured-head h3 {
      font-size: clamp(1.6rem, 3.4vw, 2.2rem);
      font-weight: 700; letter-spacing: -0.025em; line-height: 1.15;
    }
    .auto-featured-head .auto-tagline {
      color: rgba(255, 255, 255, 0.68);
      margin-top: 0.8rem; font-size: 1rem; max-width: 40rem;
    }
    .auto-body { padding: 2.2rem 2.4rem 2.4rem; }
    .auto-problem {
      font-size: 1rem; color: var(--text-soft);
      border-left: 3px solid var(--line);
      padding-left: 1.2rem; max-width: 46rem;
    }
    .auto-sublabel {
      font-size: 0.78rem; font-weight: 700; color: var(--text-muted);
      letter-spacing: 0.12em; text-transform: uppercase;
      margin: 2rem 0 0.9rem;
    }
    .auto-points { list-style: none; display: grid; gap: 0.6rem; }
    .auto-points li {
      position: relative; padding-left: 1.5rem;
      font-size: 0.95rem; color: var(--text-soft);
    }
    .auto-points li::before {
      content: '→'; position: absolute; left: 0;
      color: var(--accent); font-weight: 700;
    }
    .auto-included {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.8rem;
    }
    .auto-included div {
      background: var(--accent-soft);
      border-radius: 10px; padding: 0.9rem 1rem;
      font-size: 0.88rem; font-weight: 500; color: var(--text-soft);
    }
    .auto-included div strong { display: block; color: var(--text); font-weight: 700; margin-bottom: 0.15rem; }
    .auto-links { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1.8rem; }
    .auto-note {
      font-size: 0.84rem; color: var(--text-muted);
      margin-top: 1.8rem; padding-top: 1.4rem;
      border-top: 1px solid var(--line); line-height: 1.6;
    }

    .auto-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 0.75rem;
    }
    .auto-shot {
      border: 1px solid var(--line); border-radius: 10px;
      overflow: hidden; cursor: pointer; background: #fff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .auto-shot img {
      width: 100%; display: block;
      aspect-ratio: 16 / 10; object-fit: cover; object-position: top left;
    }
    .auto-shot:hover { transform: translateY(-3px); box-shadow: 0 14px 28px -16px rgba(0, 0, 0, 0.4); }
    .auto-shot span {
      display: block; font-size: 0.72rem; color: var(--text-muted);
      padding: 0.45rem 0.6rem; border-top: 1px solid var(--line);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .auto-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.6rem; }
    .auto-card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .auto-card:hover { transform: translateY(-4px); box-shadow: 0 20px 44px -26px rgba(0, 0, 0, 0.4); }
    .auto-card-img { cursor: pointer; background: #f2f2f2; border-bottom: 1px solid var(--line); }
    .auto-card-img img {
      width: 100%; display: block;
      aspect-ratio: 16 / 9; object-fit: cover; object-position: top center;
    }
    .auto-card-body { padding: 1.5rem 1.6rem 1.7rem; display: flex; flex-direction: column; gap: 0.8rem; flex: 1; }
    .auto-card-body h4 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.015em; }
    .auto-card-body p { font-size: 0.92rem; color: var(--text-soft); }
    .auto-formula {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.76rem; background: #0a0a0a; color: #e8e8e8;
      border-radius: 8px; padding: 0.7rem 0.8rem;
      overflow-x: auto; white-space: nowrap;
    }
    .auto-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: auto; padding-top: 0.5rem; }
    .auto-tag {
      font-size: 0.72rem; font-weight: 600;
      background: var(--accent-soft); color: var(--text-soft);
      padding: 0.3rem 0.65rem; border-radius: 6px;
    }
    .auto-steps { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .auto-steps img {
      height: 42px; width: auto; border: 1px solid var(--line);
      border-radius: 6px; cursor: pointer; background: #fff;
      transition: transform 0.2s ease;
    }
    .auto-steps img:hover { transform: translateY(-2px); }
    @media (max-width: 820px) {
      .auto-grid { grid-template-columns: 1fr; }
      .auto-featured-head, .auto-body { padding-left: 1.5rem; padding-right: 1.5rem; }
    }

    /* ===== TOOLS ===== */
    .tool-row { margin-bottom: 2rem; }
    .tool-row h4 {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .chip {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 0.5rem 1rem 0.5rem 0.8rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .chip-icon { width: 18px; height: 18px; flex-shrink: 0; }
    .chip-letter {
      width: 20px; height: 20px;
      border-radius: 4px;
      color: white;
      font-weight: 700;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }
    .social-icon-img {
      width: 38px; height: 38px;
      margin-bottom: 0.3rem;
    }
    .social-icon-emoji {
      font-size: 2rem;
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .chip:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-dark);
      transform: translateY(-2px);
    }

    /* ===== CERTIFICATES ===== */
    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .cert {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      display: flex; align-items: center; gap: 1rem;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }
    .cert:hover { border-color: var(--accent); transform: translateX(4px); }
    .cert-badge {
      width: 42px; height: 42px;
      background: var(--accent-soft);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 1.3rem;
      line-height: 1;
    }
    .cert p { font-size: 0.95rem; font-weight: 500; line-height: 1.4; }

    /* ===== SPREADSHEETS ===== */
    .sheets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 1.5rem;
    }
    .sheet-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex; flex-direction: column;
    }
    .sheet-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 40px -20px rgba(33, 115, 70, 0.25);
      border-color: #217346;
    }
    .sheet-header {
      background: linear-gradient(135deg, #217346 0%, #1a5d38 100%);
      color: white;
      padding: 1.3rem 1.5rem;
      display: flex; align-items: center; gap: 0.9rem;
    }
    .sheet-icon {
      width: 38px; height: 38px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .sheet-header h4 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
      margin: 0;
    }
    .sheet-body {
      padding: 1.3rem 1.5rem;
      flex: 1;
      display: flex; flex-direction: column;
    }
    .sheet-desc {
      color: var(--text-soft);

            h('h2', { className: 'section-title' }, 'A little bit ', h('em', null, 'about who I am'))
          ),
          h('div', { className: 'about-grid' },
            h('div', { className: 'about-text' },
              h('p', null,
                'I\'m a ', h('strong', null, 'Bachelor of Science in Information Technology'), ' student at STI College SJDM with hands-on experience supporting real businesses across administrative, creative, and digital work.'
              ),
              h('p', null,
                'I\'m ', h('strong', null, 'reliable, organized, and adaptable'), ' — able to work independently while maintaining a high standard of accuracy and communication. I\'m continuously developing my skills to stay current in a fast-moving digital environment, from social media management to SEO and data analysis.'
              ),
              h('p', null,
                'Currently open to virtual assistant and social media manager roles — happy to start with a short trial task so you can see how I work.'
              )
            ),
            h('div', { className: 'quickfacts' },
              h('h4', null, 'Quick facts'),
              h('div', { className: 'fact-row' },
                h('span', { className: 'key' }, '📍 Location'),
                h('span', { className: 'val' }, 'SJDM, Bulacan')
              ),
              h('div', { className: 'fact-row' },
                h('span', { className: 'key' }, '💼 Open to'),
                h('span', { className: 'val' }, 'Remote work')
              ),
              h('div', { className: 'fact-row' },
                h('span', { className: 'key' }, '🗣️ Languages'),
                h('span', { className: 'val' }, 'English, Filipino')
              ),
              h('div', { className: 'fact-row' },
                h('span', { className: 'key' }, '✅ Status'),
                h('span', { className: 'val' }, 'Available now')
              )
            )
          )
        )
      );
    }

    function TList(items) {
      return h('div', { className: 'cards' },
        items.map((t, i) =>
          h('div', { className: 'card', key: i },
            h('div', { className: 'card-head' },
              h('h3', null, t.title),
              h('span', { className: 'when' }, t.when)
            ),
            h('div', { className: 'where' }, t.where),
            h('ul', null, t.bullets.map((b, j) => h('li', { key: j }, b)))
          )
        )
      );
    }

    function Experience() {
      return h('section', { id: 'experience', className: 'section' },
        h('div', { className: 'wrap' },
          h('div', { className: 'section-header' },
            h('span', { className: 'section-eyebrow' }, 'My journey'),
            h('h2', { className: 'section-title' }, 'Work ', h('em', null, 'experience'))
          ),
          TList(EXPERIENCE),
          h('div', { className: 'section-header', style: { marginTop: '5rem' } },
            h('span', { className: 'section-eyebrow' }, 'Education'),
            h('h2', { className: 'section-title' }, 'What I\'m ', h('em', null, 'studying'))
          ),
          TList(EDUCATION)
        )
      );
    }

    function Skills() {
      return h('section', { id: 'skills', className: 'section section-alt' },
        h('div', { className: 'wrap' },
          h('div', { className: 'section-header' },
            h('span', { className: 'section-eyebrow' }, 'What I do' ),
            h('h2', { className: 'section-title' }, 'Skills & ', h('em', null, 'services'))
          ),
          h('div', { className: 'skill-grid' },
            SKILLS.map((s, i) =>
              h('div', { className: 'skill-card', key: i },
                h('div', { className: 'skill-icon' }, s.icon),
                h('h4', null, s.title),
                h('ul', null, s.items.map((x, j) => h('li', { key: j }, x)))
              )
            )
          ),
          h('div', { style: { marginTop: '4rem' } },
            h('h4', { style: { fontSize: '0.9rem', color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.1em', textAlign: 'center', marginBottom: '2rem', fontWeight: 600 } }, 'Tools I work with'),
            TOOLS.map((t, i) =>
              h('div', { className: 'tool-row', key: i, style: { textAlign: 'center' } },
                h('h4', null, t.group),
                h('div', { className: 'chips', style: { justifyContent: 'center' } },
                  t.items.map((x, j) =>
                    h('span', { className: 'chip', key: j },
                      x.icon
                        ? h('img', { src: x.icon, className: 'chip-icon', alt: '', loading: 'lazy' })
                        : h('span', { className: 'chip-letter', style: { background: x.bg } }, x.letter),
                      x.name
                    )
                  )
                )
              )
            )
          ),
          h('div', { style: { marginTop: '4rem' } },
            h('h4', { style: { fontSize: '0.9rem', color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.1em', textAlign: 'center', marginBottom: '2rem', fontWeight: 600 } }, 'Certifications & Training'),
            h('div', { className: 'cert-grid' },
              CERTS.map((c, i) =>
                h('div', { className: 'cert', key: i },
                  h('div', { className: 'cert-badge' }, c.icon),
                  h('p', null, c.name)
                )
              )
            )
          )
        )
      );
    }


    function Automations() {
      const [shot, setShot] = useState(null);
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') setShot(null); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const gallery = (shots) => h('div', { className: 'auto-gallery' },
        shots.map((sh, i) =>
          h('div', { className: 'auto-shot', key: i, onClick: () => setShot(sh) },
            h('img', { src: sh.src, alt: sh.label, loading: 'lazy' }),
            h('span', null, sh.label)
          )
        )
      );

      return h(F, null,
        h('section', { id: 'automations', className: 'section' },
          h('div', { className: 'wrap' },
            h('div', { className: 'section-header' },
              h('span', { className: 'section-eyebrow' }, 'Automation work'),
              h('h2', { className: 'section-title' }, 'Systems I\'ve ', h('em', null, 'built')),
              h('p', { className: 'section-sub' }, 'CRM builds and automations that answer leads, chase follow-ups, and put the right information in front of a team before anyone has to ask. Click any screenshot to see it full size.')
            ),

            h('div', { className: 'auto-featured' },
              h('div', { className: 'auto-featured-head' },
                h('span', { className: 'auto-badge' }, FEATURED.badge),
                h('h3', null, FEATURED.title),
                h('p', { className: 'auto-tagline' }, FEATURED.tagline)
              ),
              h('div', { className: 'auto-body' },
                h('p', { className: 'auto-problem' }, FEATURED.problem),

                h('div', { className: 'auto-sublabel' }, 'What the system does'),
                h('ul', { className: 'auto-points' },
                  FEATURED.points.map((p, i) => h('li', { key: i }, p))
                ),

                h('div', { className: 'auto-sublabel' }, 'What\'s included'),
                h('div', { className: 'auto-included' },
                  FEATURED.included.map((x, i) =>
                    h('div', { key: i }, h('strong', null, x.k), x.v)
                  )
                ),

                h('div', { className: 'auto-sublabel' }, 'Reusable by design'),
                h('p', { style: { fontSize: '0.95rem', color: 'var(--text-soft)', maxWidth: '46rem' } }, FEATURED.reusable),

                h('div', { className: 'auto-links' },
                  FEATURED.links.map((l, i) =>
                    h('a', { key: i, href: l.href, target: '_blank', rel: 'noopener',
                             className: 'btn ' + (i === 0 ? 'btn-primary' : 'btn-ghost') }, l.label)
                  )
                ),

                h('div', { className: 'auto-sublabel' }, 'Inside the build'),
                gallery(FEATURED.shots),

                h('div', { className: 'auto-tags', style: { marginTop: '1.6rem' } },
                  FEATURED.tags.map((t, i) => h('span', { className: 'auto-tag', key: i }, t))
                ),
                h('p', { className: 'auto-note' }, FEATURED.note)
              )
            ),

            h('div', { className: 'auto-grid' },
              AUTOMATIONS.map((a, i) =>
                h('div', { className: 'auto-card', key: i },
                  h('div', { className: 'auto-card-img', onClick: () => setShot({ src: a.img, label: a.title }) },
                    h('img', { src: a.img, alt: a.title, loading: 'lazy' })
                  ),
                  h('div', { className: 'auto-card-body' },
                    h('h4', null, a.title),
                    h('p', null, a.blurb),
                    h('p', null, a.detail),
                    a.detail2 ? h('p', null, a.detail2) : null,
                    a.formula ? h('div', { className: 'auto-formula' }, a.formula) : null,
                    h('div', { className: 'auto-steps' },
                      a.steps.map((sh, j) =>
                        h('img', { key: j, src: sh.src, alt: sh.label, title: sh.label,
                                   loading: 'lazy', onClick: () => setShot(sh) })
                      )
                    ),
                    h('div', { className: 'auto-tags' },
                      a.tags.map((t, j) => h('span', { className: 'auto-tag', key: j }, t))
                    )
                  )
                )
              )
            )
          )
        ),
        shot && h('div', { className: 'modal', onClick: () => setShot(null) },
          h('button', { className: 'modal-close', onClick: () => setShot(null), 'aria-label': 'Close' }, '×'),
          h('img', { src: shot.src, alt: shot.label, onClick: (e) => e.stopPropagation() })
        )
      );
    }

    function Portfolio() {
      const [active, setActive] = useState(null);
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') setActive(null); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      return h(F, null,
        h('section', { id: 'portfolio', className: 'section' },
          h('div', { className: 'wrap' },
            h('div', { className: 'section-header' },
              h('span', { className: 'section-eyebrow' }, 'Portfolio'),
              h('h2', { className: 'section-title' }, 'Graphic ', h('em', null, 'design work')),
              h('p', { className: 'section-sub' }, 'A collection of social media ads and promotional designs across food, fashion, e-commerce, and health products. Click any design to see it bigger.')
            ),
            h('div', { className: 'portfolio-grid' },
              PORTFOLIO.map((p, i) =>
                h('div', { className: 'design-card', key: i, onClick: () => setActive(p) },
                  h('div', { className: 'design-img-wrap' },
                    h('img', { src: p.src, alt: p.title, className: 'design-img', loading: 'lazy' })
                  ),
                  h('div', { className: 'design-info' },
                    h('h4', null, p.title),
                    h('p', null, p.category)
                  )
                )
              )
            )
          )
        ),
        active && h('div', { className: 'modal', onClick: () => setActive(null) },
          h('button', { className: 'modal-close', onClick: () => setActive(null), 'aria-label': 'Close' }, '×'),
          h('img', { src: active.src, alt: active.title, onClick: (e) => e.stopPropagation() })
        )
      );
    }

    function Spreadsheets() {
      return h('section', { id: 'spreadsheets', className: 'section section-alt' },
        h('div', { className: 'wrap' },
          h('div', { className: 'section-header' },
            h('span', { className: 'section-eyebrow' }, 'Spreadsheet work'),
            h('h2', { className: 'section-title' }, 'Sample ', h('em', null, 'Spreadsheets')),
            h('p', { className: 'section-sub' }, 'Real Excel samples showing data entry, formulas, pivot tables, and content planning. Click any card to open the live Google Sheet in a new tab.')
          ),
          h('div', { className: 'sheets-grid' },
            SPREADSHEETS.map((s, i) =>
              h('div', { className: 'sheet-card', key: i },
                h('div', { className: 'sheet-header' },
                  h('div', { className: 'sheet-icon' }, 'X'),
                  h('h4', null, s.title)
                ),
                h('div', { className: 'sheet-body' },
                  h('p', { className: 'sheet-desc' }, s.desc),
                  h('div', { className: 'sheet-preview' },
                    h('table', null,
                      h('thead', null,
                        h('tr', null,
                          s.preview.headers.map((header, j) =>
                            h('th', { key: j }, header)
                          )
                        )
                      ),
                      h('tbody', null,
                        s.preview.rows.map((row, j) =>
                          h('tr', { key: j },
                            row.map((cell, k) =>
                              h('td', { key: k }, cell)
                            )
                          )
                        )
                      )
                    )
                  ),
                  h('div', { className: 'sheet-tags' },
                    s.tags.map((tag, j) =>
                      h('span', { className: 'sheet-tag', key: j }, tag)
                    )
                  ),
                  h('a', { href: s.file, target: '_blank', rel: 'noopener', className: 'sheet-download' },
                    '📊 View Spreadsheet'
                  )
                )
              )
            )
          )
        )
      );
    }

    function Contact() {
      return h('section', { id: 'contact', className: 'contact' },
        h('span', { className: 'section-eyebrow' }, 'Let\'s connect'),
        h('h2', null, 'Have a project ', h('em', null, 'in mind?')),
        h('p', null, 'I\'d love to hear about it. Send me a message on any of the platforms below — I usually respond within a day.'),
        h('div', { className: 'contact-grid' },
          SOCIAL.map((s, i) =>
            h('a', { href: s.href, target: s.href.startsWith('http') ? '_blank' : null, rel: 'noopener', className: 'social-btn', key: i },
              s.icon
                ? h('img', { src: s.icon, className: 'social-icon-img', alt: '' })
                : h('span', { className: 'social-icon-emoji' }, s.emoji),
              h('span', { className: 'label' }, s.label),
              h('span', { className: 'value' }, s.value)
            )
          )
        )
      );
    }

    function App() {
      return h(F, null,
        h(Nav), h(Hero), h(About), h(Experience), h(Skills), h(Automations), h(Portfolio), h(Spreadsheets), h(Contact),
        h('footer', { className: 'footer' },
          '© 2026 Danielle Angelo Malixi · Built with ', h('span', null, 'React')
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
