<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danielle Angelo Malixi — AI Automation & GoHighLevel Specialist</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #0a0a0a;
      --text-soft: #4a4a4a;
      --text-muted: #888888;
      --line: #e5e5e5;
      --accent: #0a0a0a;
      --accent-soft: #f0f0f0;
      --accent-dark: #000000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .serif { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; }
    a { color: inherit; }

    /* ===== NAV ===== */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(250, 250, 247, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s ease;
    }
    .nav.scrolled { border-bottom-color: var(--line); }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      padding: 1.1rem 2rem;
      display: flex; justify-content: flex-end; align-items: center;
    }
    .nav-logo {
      font-size: 1.15rem; font-weight: 700;
      color: var(--text); text-decoration: none;
      letter-spacing: -0.02em;
    }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      font-size: 0.92rem; font-weight: 500;
      color: var(--text-soft); text-decoration: none;
      transition: color 0.2s ease;
      padding: 0.3rem 0;
      position: relative;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--accent); }
    .nav-links a.active::after {
      content: ''; position: absolute;
      left: 0; right: 0; bottom: -2px;
      height: 2px; background: var(--accent); border-radius: 2px;
    }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }

    /* ===== HERO ===== */
    .hero {
      min-height: 100vh;
      display: flex; align-items: center;
      padding: 7rem 2rem 4rem;
      max-width: 1100px; margin: 0 auto;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 4rem;
      align-items: center;
      width: 100%;
    }
    @media (max-width: 820px) {
      .hero-grid { grid-template-columns: 1fr; gap: 2.5rem; text-align: center; }
      .hero-photo-wrap { order: -1; max-width: 280px; margin: 0 auto; }
    }
    .hero-tag {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--accent-soft);
      color: var(--accent-dark);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.82rem; font-weight: 600;
      margin-bottom: 1.5rem;
      opacity: 0; animation: rise 0.8s ease 0.1s forwards;
    }
    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 1.2rem;
      opacity: 0; animation: rise 0.9s ease 0.25s forwards;
    }
    .hero h1 .accent { color: var(--accent); }
    .hero-role {
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      color: var(--text-soft);
      margin-bottom: 1.5rem;
      font-weight: 500;
      opacity: 0; animation: rise 0.9s ease 0.4s forwards;
    }
    .hero-desc {
      font-size: 1.05rem;
      color: var(--text-soft);
      margin-bottom: 2.2rem;
      line-height: 1.75;
      max-width: 32rem;
      opacity: 0; animation: rise 0.9s ease 0.55s forwards;
    }
    .hero-actions {
      display: flex; flex-wrap: wrap; gap: 0.8rem;
      opacity: 0; animation: rise 0.9s ease 0.7s forwards;
    }
    @media (max-width: 820px) {
      .hero-actions { justify-content: center; }
    }
    .btn {
      font-size: 0.95rem; font-weight: 600;
      padding: 0.85rem 1.6rem;
      text-decoration: none;
      border-radius: 999px;
      transition: all 0.25s ease;
      display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.3); }
    .btn-ghost {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

    /* Profile photo */
    .hero-photo-wrap {
      position: relative;
      opacity: 0; animation: rise 1s ease 0.3s forwards;
    }
    .hero-photo {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 20%;
      background: var(--accent-soft);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.15);
    }
    .hero-photo-deco {
      position: absolute;
      inset: -12px;
      border: 2px dashed var(--accent);
      border-radius: 50%;
      opacity: 0.5;
      animation: spin 30s linear infinite;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== SECTIONS ===== */
    .section { padding: 6rem 0; }
    .section-alt { background: #fff; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }
    .section-eyebrow {
      display: inline-block;
      color: #2563eb;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }
    .section-title {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .section-title em { font-style: normal; color: var(--accent); }
    .section-sub {
      color: var(--text-soft);
      font-size: 1.05rem;
      max-width: 36rem;
      margin: 1rem auto 0;
    }

    /* ===== ABOUT ===== */
    .about-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 3rem;
      align-items: start;
    }
    @media (max-width: 820px) { .about-grid { grid-template-columns: 1fr; gap: 2rem; } }
    .about-text p {
      color: var(--text-soft);
      font-size: 1.05rem;
      margin-bottom: 1.2rem;
      line-height: 1.8;
    }
    .about-text strong { color: var(--text); font-weight: 600; }
    .quickfacts {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 2rem;
    }
    .quickfacts h4 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      font-weight: 600;
    }
    .fact-row {
      display: flex; justify-content: space-between;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.95rem;
    }
    .fact-row:last-child { border-bottom: none; }
    .fact-row .key { color: var(--text-muted); }
    .fact-row .val { color: var(--text); font-weight: 500; text-align: right; }

    /* ===== EXPERIENCE / EDUCATION ===== */
    .cards { display: grid; gap: 1.2rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 2rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.1);
      border-color: var(--accent);
    }
    .card-head {
      display: flex; justify-content: space-between;
      flex-wrap: wrap; gap: 0.5rem;
      margin-bottom: 0.3rem;
    }
    .card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }
    .card .when {
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 600;
      background: var(--accent-soft);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .card .where {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-weight: 500;
    }
    .card ul { list-style: none; }
    .card li {
      color: var(--text-soft);
      font-size: 0.96rem;
      padding: 0.3rem 0 0.3rem 1.4rem;
      position: relative;
      line-height: 1.6;
    }
    .card li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #16a34a;
      font-weight: 700;
    }

    /* ===== SKILLS ===== */
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.2rem;
    }
    .skill-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1.8rem;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .skill-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .skill-icon {
      width: 56px; height: 56px;
      background: var(--accent-soft);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin-bottom: 1.2rem;
      line-height: 1;
    }
    .skill-card h4 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }
    .skill-card ul { list-style: none; }
    .skill-card li {
      color: var(--text-soft);
      font-size: 0.92rem;
      padding: 0.3rem 0;
    }
    .skill-card li::before {
      content: '— ';
      color: var(--accent);
    }

    /* ===== PORTFOLIO ===== */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .design-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .design-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.15);
    }
    .design-img-wrap {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--accent-soft);
    }
    .design-img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .design-card:hover .design-img { transform: scale(1.05); }
    .design-info {
      padding: 1.3rem 1.5rem;
    }
    .design-info h4 {
      font-size: 1.1rem; font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .design-info p {
      font-size: 0.88rem; color: var(--text-muted);
    }
    /* Modal */
    .modal {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(20, 20, 20, 0.85);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
      animation: fadein 0.25s ease;
    }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .modal img {
      max-width: 90vw; max-height: 88vh;
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    }
    .modal-close {
      position: absolute; top: 1.5rem; right: 1.5rem;
      background: #fff; color: var(--text);
      width: 44px; height: 44px;
      border: none; border-radius: 50%;
      cursor: pointer; font-size: 1.4rem;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s ease;
    }
    .modal-close:hover { transform: rotate(90deg) scale(1.1); }


    /* ===== AUTOMATIONS ===== */
    .cs {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 2.5rem;
      box-shadow: 0 20px 50px -38px rgba(0, 0, 0, 0.4);
    }
    .cs-head { padding: 2.4rem 2.6rem 2rem; border-bottom: 1px solid var(--line); }
    .cs-head.dark { background: #0a0a0a; color: #fff; border-bottom: none; }
    .cs-badge {
      display: inline-block;
      background: var(--accent-soft); color: var(--text-soft);
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 0.4rem 0.8rem; border-radius: 999px;
      margin-bottom: 1rem;
    }
    .cs-head.dark .cs-badge { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .cs-head h3 {
      font-size: clamp(1.45rem, 3.2vw, 2.1rem);
      font-weight: 700; letter-spacing: -0.025em; line-height: 1.15;
    }
    .cs-tagline { margin-top: 0.7rem; font-size: 1rem; color: var(--text-soft); max-width: 42rem; }
    .cs-head.dark .cs-tagline { color: rgba(255, 255, 255, 0.68); }
    .cs-meta { margin-top: 1.4rem; display: grid; gap: 0.35rem; font-size: 0.9rem; color: var(--text-soft); }
    .cs-head.dark .cs-meta { color: rgba(255, 255, 255, 0.75); }
    .cs-meta strong { color: var(--text); font-weight: 700; }
    .cs-head.dark .cs-meta strong { color: #fff; }

    .cs-body { padding: 2.2rem 2.6rem 2.6rem; }
    .cs-h {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 1.5rem; font-weight: 400; letter-spacing: -0.01em;
      margin: 2.4rem 0 1rem;
    }
    .cs-body > .cs-h:first-child { margin-top: 0; }
    .cs-sub {
      font-size: 0.78rem; font-weight: 700; color: var(--text-muted);
      letter-spacing: 0.12em; text-transform: uppercase;
      margin: 1.8rem 0 0.8rem;
    }
    .cs-p { font-size: 0.98rem; color: var(--text-soft); max-width: 48rem; margin-bottom: 0.8rem; }
    .cs-ul { list-style: none; display: grid; gap: 0.55rem; margin: 0.4rem 0 1rem; max-width: 48rem; }
    .cs-ul li { position: relative; padding-left: 1.5rem; font-size: 0.96rem; color: var(--text-soft); }
    .cs-ul li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
    .cs-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem; background: #0a0a0a; color: #e8e8e8;
      border-radius: 8px; padding: 0.85rem 1rem;
      overflow-x: auto; white-space: nowrap; margin: 0.6rem 0 1rem;
    }
    .cs-fig { margin: 1.2rem 0 1.6rem; }
    .cs-fig img {
      display: block; width: 100%; max-width: 720px;
      border: 1px solid var(--line); border-radius: 10px;
      cursor: zoom-in; background: #fff;
      transition: box-shadow 0.2s ease;
    }
    .cs-fig img:hover { box-shadow: 0 16px 34px -20px rgba(0, 0, 0, 0.45); }
    .cs-fig.small img { max-width: 380px; }
    .cs-cap { font-size: 0.83rem; color: var(--text-muted); margin-top: 0.55rem; max-width: 720px; }
    .cs-links { display: flex; flex-wrap: wrap; gap: 0.8rem; margin: 1.4rem 0 0.5rem; }
    .cs-note {
      font-size: 0.86rem; color: var(--text-muted); font-style: italic;
      margin-top: 2rem; padding-top: 1.4rem; border-top: 1px solid var(--line);
    }
    .cs-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1.6rem; }
    .cs-tag {
      font-size: 0.72rem; font-weight: 600;
      background: var(--accent-soft); color: var(--text-soft);
      padding: 0.3rem 0.65rem; border-radius: 6px;
    }
    @media (max-width: 820px) {
      .cs-head, .cs-body { padding-left: 1.4rem; padding-right: 1.4rem; }
      .cs-h { font-size: 1.3rem; }
    }

    /* ===== TOOLS ===== */
    .tool-row { margin-bottom: 2rem; }
    .tool-row h4 {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .chip {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 0.5rem 1rem 0.5rem 0.8rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .chip-icon { width: 18px; height: 18px; flex-shrink: 0; }
    .chip-letter {
      width: 20px; height: 20px;
      border-radius: 4px;
      color: white;
      font-weight: 700;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }
    .social-icon-img {
      width: 38px; height: 38px;
      margin-bottom: 0.3rem;
    }
    .social-icon-emoji {
      font-size: 2rem;
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .chip:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-dark);
      transform: translateY(-2px);
    }

    /* ===== CERTIFICATES ===== */
    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .cert {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.2rem 1.4rem;
      display: flex; align-items: center; gap: 1rem;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }
    .cert:hover { border-color: var(--accent); transform: translateX(4px); }
    .cert-badge {
      width: 42px; height: 42px;
      background: var(--accent-soft);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 1.3rem;
      line-height: 1;
    }
    .cert p { font-size: 0.95rem; font-weight: 500; line-height: 1.4; }

    /* ===== SPREADSHEETS ===== */
    .sheets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 1.5rem;
    }
    .sheet-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex; flex-direction: column;
    }
    .sheet-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 40px -20px rgba(33, 115, 70, 0.25);
      border-color: #217346;
    }
    .sheet-header {
      background: linear-gradient(135deg, #217346 0%, #1a5d38 100%);
      color: white;
      padding: 1.3rem 1.5rem;
      display: flex; align-items: center; gap: 0.9rem;
    }
    .sheet-icon {
      width: 38px; height: 38px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .sheet-header h4 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
      margin: 0;
    }
    .sheet-body {
      padding: 1.3rem 1.5rem;
      flex: 1;
      display: flex; flex-direction: column;
    }
    .sheet-desc {
      color: var(--text-soft);
      font-size: 0.9rem;
      line-height: 1.55;
      margin-bottom: 1.1rem;
    }
    .sheet-preview {
      background: #fafafa;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1.1rem;
    }
    .sheet-preview table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    .sheet-preview th {
      background: #e8f0ec;
      color: #1a5d38;
      font-weight: 700;
      padding: 0.5rem 0.7rem;
      text-align: left;
      border-bottom: 1px solid #d4e0d8;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sheet-preview td {
      padding: 0.5rem 0.7rem;
      border-bottom: 1px solid #f0f0f0;
      color: var(--text-soft);
    }
    .sheet-preview tr:last-child td { border-bottom: none; }
    .sheet-tags {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
      margin-bottom: 1.1rem;
    }
    .sheet-tag {
      background: #e8f0ec;
      color: #1a5d38;
      font-size: 0.74rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .sheet-download {
      margin-top: auto;
      background: #217346;
      color: white;

    function Nav() {
      const [active, setActive] = useState('home');
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => {
          setScrolled(window.scrollY > 30);
          const pos = window.scrollY + 130;
          for (const id of NAV) {
            const el = document.getElementById(id);
            if (el && el.offsetTop <= pos && el.offsetTop + el.offsetHeight > pos) { setActive(id); break; }
          }
        };
        window.addEventListener('scroll', onScroll); onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return h('nav', { className: 'nav' + (scrolled ? ' scrolled' : '') },
        h('div', { className: 'nav-inner' },
          h('ul', { className: 'nav-links' },
            NAV.map(item => h('li', { key: item },
              h('a', { href: '#' + item, className: active === item ? 'active' : '' },
                item.charAt(0).toUpperCase() + item.slice(1))
            ))
          )
        )
      );
    }
