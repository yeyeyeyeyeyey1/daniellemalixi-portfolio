<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danielle Angelo Malixi — AI Automation & GoHighLevel Specialist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    /* ============================================================
       Visual system: "workflow canvas"
       Drawn from the tools this work is actually built in —
       dot-grid editor backgrounds, node markers, connector lines,
       monospace labels, and status pills.
       ============================================================ */
    :root {
      --bg: #F6F7FA;
      --surface: #FFFFFF;
      --surface-2: #FBFCFE;
      --ink: #0B1020;
      --soft: #48526B;
      --muted: #7A849B;
      --line: #E2E7F0;
      --line-strong: #CDD5E4;
      --accent: #2B4EFF;
      --accent-ink: #1E3ACC;
      --accent-soft: #EDF1FF;
      --live: #12B76A;
      --r: 10px;
      --grid: radial-gradient(circle, var(--line-strong) 1px, transparent 1.2px);

      /* legacy aliases still referenced inline */
      --card: var(--surface);
      --text: var(--ink);
      --text-soft: var(--soft);
      --text-muted: var(--muted);
      --accent-dark: var(--accent-ink);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    .mono, .eyebrow {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
    }

    /* ===== NAV ===== */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(246, 247, 250, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s ease;
    }
    .nav.scrolled { border-bottom-color: var(--line); }
    .nav-inner {
      max-width: 1120px; margin: 0 auto;
      padding: 1rem 2rem;
      display: flex; justify-content: flex-end; align-items: center;
    }
    .nav-links { display: flex; gap: 1.9rem; list-style: none; }
    .nav-links a {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted); text-decoration: none;
      padding: 0.3rem 0; position: relative;
      transition: color 0.2s ease;
    }
    .nav-links a:hover { color: var(--ink); }
    .nav-links a.active { color: var(--accent); }
    .nav-links a.active::after {
      content: ''; position: absolute;
      left: 0; right: 0; bottom: -3px;
      height: 2px; background: var(--accent);
    }
    @media (max-width: 720px) {
      .nav-inner { padding: 0.8rem 1rem; justify-content: center; }
      .nav-links { gap: 1rem; flex-wrap: wrap; justify-content: center; }
      .nav-links a { font-size: 0.7rem; }
    }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 2rem; }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex; align-items: center;
      padding: 8rem 2rem 5rem;
      max-width: 1120px; margin: 0 auto;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: var(--grid);
      background-size: 24px 24px;
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 20%, transparent 75%);
      mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 20%, transparent 75%);
      pointer-events: none; z-index: 0;
    }
    .hero-grid {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: 1.25fr 1fr;
      gap: 4rem; align-items: center; width: 100%;
    }
    .hero-tag {
      display: inline-flex; align-items: center; gap: 0.55rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      background: var(--surface); color: var(--soft);
      border: 1px solid var(--line);
      padding: 0.4rem 0.85rem; border-radius: 999px;
      margin-bottom: 1.6rem;
    }
    .hero-tag::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%;
      background: var(--live); box-shadow: 0 0 0 3px rgba(18, 183, 106, 0.18);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(18, 183, 106, 0.18); }
      50% { box-shadow: 0 0 0 6px rgba(18, 183, 106, 0.06); }
    }
    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.1rem);
      font-weight: 700; line-height: 1.05;
      letter-spacing: -0.04em;
    }
    .hero h1 .accent { color: var(--accent); }
    .hero-role {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem; color: var(--accent);
      letter-spacing: 0.02em;
      margin-top: 1.4rem;
      padding-left: 1.1rem; position: relative;
    }
    .hero-role::before {
      content: ''; position: absolute; left: 0; top: 0.6em;
      width: 6px; height: 6px; background: var(--accent);
    }
    .hero-desc {
      font-size: 1.05rem; color: var(--soft);
      margin-top: 1.2rem; max-width: 34rem;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 0.9rem; margin-top: 2.4rem; }
    .hero-photo-wrap { position: relative; justify-self: center; }
    .hero-photo-deco {
      position: absolute; inset: 0;
      transform: translate(16px, 16px);
      border: 1px solid var(--accent);
      border-radius: var(--r);
      background-image: var(--grid); background-size: 14px 14px;
    }
    .hero-photo {
      position: relative; display: block;
      width: min(330px, 70vw); aspect-ratio: 4 / 5;
      object-fit: cover; object-position: top center;
      border: 1px solid var(--line-strong); border-radius: var(--r);
      background: var(--surface);
    }
    @media (max-width: 860px) {
      .hero { padding-top: 9rem; }
      .hero-grid { grid-template-columns: 1fr; gap: 3rem; }
      .hero-desc { max-width: none; }
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem; font-weight: 500; letter-spacing: 0.03em;
      padding: 0.75rem 1.35rem; border-radius: var(--r);
      text-decoration: none; cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-ink); transform: translateY(-2px); }
    .btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

    /* ===== SECTIONS ===== */
    .section { padding: 6.5rem 0; position: relative; }
    .section-alt { background: var(--surface-2); border-block: 1px solid var(--line); }
    .section-alt::before {
      content: ''; position: absolute; inset: 0;
      background-image: var(--grid); background-size: 24px 24px;
      opacity: 0.55; pointer-events: none;
    }
    .section-alt > * { position: relative; }
    .section-header { text-align: center; margin-bottom: 3.5rem; }
    .section-eyebrow {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 1rem;
    }
    .section-eyebrow::before {
      content: ''; width: 6px; height: 6px;
      background: var(--accent); transform: rotate(45deg);
    }
    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.9rem, 4vw, 2.7rem);
      font-weight: 700; letter-spacing: -0.035em; line-height: 1.12;
    }
    .section-title em { font-style: normal; color: var(--accent); }
    .section-sub {
      color: var(--soft); font-size: 1rem;
      max-width: 38rem; margin: 1rem auto 0;
    }

    /* ===== ABOUT ===== */
    .about-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 3.5rem; align-items: start; }
    .about-text p { color: var(--soft); margin-bottom: 1.1rem; font-size: 1rem; }
    .about-text strong { color: var(--ink); font-weight: 600; }
    .quickfacts {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); padding: 1.6rem;
      position: relative;
    }
    .quickfacts::before {
      content: ''; position: absolute; top: -1px; left: 1.6rem; right: 1.6rem;
      height: 2px; background: var(--accent);
    }
    .quickfacts h4 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1.1rem; font-weight: 500;
    }
    .fact-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; padding: 0.7rem 0; border-top: 1px solid var(--line);
      font-size: 0.9rem;
    }
    .fact-row .key { color: var(--muted); }
    .fact-row .val { font-weight: 600; color: var(--ink); }
    @media (max-width: 860px) { .about-grid { grid-template-columns: 1fr; gap: 2rem; } }

    /* ===== TIMELINE CARDS (experience / education) ===== */
    .cards { display: grid; gap: 1.2rem; max-width: 54rem; margin: 0 auto; }
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); padding: 1.7rem 1.8rem;
      position: relative; padding-left: 2.4rem;
    }
    .card::before {
      content: ''; position: absolute; left: 1.15rem; top: 2.1rem; bottom: 1.7rem;
      width: 1px; background: var(--line-strong);
    }
    .card::after {
      content: ''; position: absolute; left: 0.95rem; top: 1.9rem;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--surface); border: 2px solid var(--accent);
    }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
    .card-head h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem; font-weight: 600; letter-spacing: -0.02em;
    }
    .card .when {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.74rem; color: var(--muted); white-space: nowrap;
    }
    .card .where { font-size: 0.88rem; color: var(--accent); margin: 0.3rem 0 1rem; }
    .card ul { list-style: none; display: grid; gap: 0.45rem; }
    .card li { position: relative; padding-left: 1.1rem; font-size: 0.93rem; color: var(--soft); }
    .card li::before {
      content: ''; position: absolute; left: 0; top: 0.62em;
      width: 5px; height: 1px; background: var(--line-strong);
    }

    /* ===== SKILLS ===== */
    .skill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: 1.2rem; }
    .skill-card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); padding: 1.7rem;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .skill-card:hover { border-color: var(--accent); transform: translateY(-3px); }
    .skill-icon { font-size: 1.4rem; margin-bottom: 0.9rem; }
    .skill-card h4 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem; font-weight: 600; letter-spacing: -0.015em;
      margin-bottom: 0.9rem;
    }
    .skill-card ul { list-style: none; display: grid; gap: 0.4rem; }
    .skill-card li { font-size: 0.88rem; color: var(--soft); padding-left: 1.1rem; position: relative; }
    .skill-card li::before {
      content: ''; position: absolute; left: 0; top: 0.6em;
      width: 5px; height: 1px; background: var(--accent);
    }

    /* ===== TOOLS ===== */
    .tool-row { margin-bottom: 2rem; }
    .tool-row h4 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); font-weight: 500; margin-bottom: 0.9rem;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); padding: 0.5rem 0.85rem;
      font-size: 0.85rem; font-weight: 500; color: var(--soft);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .chip:hover { border-color: var(--accent); color: var(--ink); transform: translateY(-2px); }
    .chip-icon { width: 17px; height: 17px; flex-shrink: 0; }
    .chip-letter {
      width: 17px; height: 17px; border-radius: 4px; flex-shrink: 0;
      color: #fff; font-size: 0.62rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    .block-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted);
      text-align: center; margin-bottom: 2rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .block-label::before, .block-label::after {
      content: ''; flex: 1; height: 1px; background: var(--line);
    }

    /* ===== CERTS ===== */
    .cert-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.8rem; }
    .cert {
      display: flex; align-items: center; gap: 0.85rem;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); padding: 0.95rem 1.1rem;
    }
    .cert-badge { font-size: 1.1rem; flex-shrink: 0; }
    .cert p { font-size: 0.87rem; color: var(--soft); }

    /* ===== PORTFOLIO: category tabs ===== */
    .cs-tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 2.8rem; }
    .cs-tab {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem; font-weight: 500; letter-spacing: 0.03em;
      padding: 0.6rem 1.1rem; border-radius: var(--r);
      border: 1px solid var(--line); background: var(--surface);
      color: var(--muted); cursor: pointer;
      transition: all 0.2s ease;
    }
    .cs-tab:hover { border-color: var(--accent); color: var(--ink); }
    .cs-tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ===== WORK CARDS ===== */
    .work-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.4rem; align-items: start; }
    .work {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); overflow: hidden;
      display: flex; flex-direction: column;
      transition: border-color 0.25s ease, transform 0.25s ease;
    }
    .work:hover { border-color: var(--line-strong); transform: translateY(-3px); }
    .work.open { grid-column: 1 / -1; transform: none; border-color: var(--accent); }
    .work-thumb { border-bottom: 1px solid var(--line); background: var(--surface-2); cursor: zoom-in; }
    .work-thumb img { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; object-position: top center; }
    .work-body { padding: 1.6rem 1.7rem 1.8rem; display: flex; flex-direction: column; gap: 1rem; }
    .work-kicker {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem; font-weight: 500; color: var(--accent);
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .work-body h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem; font-weight: 600; letter-spacing: -0.025em;
    }
    .work-sum { font-size: 0.94rem; color: var(--soft); }
    .work-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .work-stat {
      background: var(--accent-soft); border-radius: var(--r);
      padding: 0.85rem 0.6rem; text-align: center;
    }
    .work-stat b {
      display: block; font-family: 'IBM Plex Mono', monospace;
      font-size: 0.95rem; font-weight: 600; color: var(--accent-ink);
      letter-spacing: -0.01em;
    }
    .work-stat span { font-size: 0.68rem; color: var(--muted); line-height: 1.3; display: block; margin-top: 0.25rem; }

    /* connector-line flow, mirroring a workflow canvas */
    .work-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 0; }
    .work-flow i {
      font-style: normal; width: 16px; height: 1px;
      background: var(--line-strong); flex-shrink: 0;
    }
    .work-flow span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem; font-weight: 500;
      background: var(--surface); border: 1px solid var(--line-strong);
      border-radius: 6px; padding: 0.32rem 0.6rem; color: var(--soft);
      margin: 0.2rem 0;
    }
    .work-more {
      align-self: flex-start; font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem; font-weight: 500; letter-spacing: 0.03em;
      padding: 0.6rem 1.1rem; border-radius: var(--r);
      border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
      cursor: pointer; transition: all 0.2s ease;
    }
    .work-more:hover { border-color: var(--accent); color: var(--accent); }
    .work-full { border-top: 1px solid var(--line); margin-top: 0.5rem; padding-top: 1.8rem; }
    @media (max-width: 900px) { .work-grid { grid-template-columns: 1fr; } }

    /* ===== CASE STUDY BODY ===== */
    .cs-h {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem; font-weight: 600; letter-spacing: -0.025em;
      margin: 2.6rem 0 1rem; padding-left: 1rem; position: relative;
    }
    .cs-h::before {
      content: ''; position: absolute; left: 0; top: 0.3em; bottom: 0.3em;
      width: 3px; background: var(--accent);
    }
    .work-full > .cs-h:first-child { margin-top: 0; }
    .cs-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem; font-weight: 500; color: var(--muted);
      letter-spacing: 0.12em; text-transform: uppercase;
      margin: 2rem 0 0.8rem;
    }
    .cs-p { font-size: 0.97rem; color: var(--soft); max-width: 48rem; margin-bottom: 0.8rem; }
    .cs-ul { list-style: none; display: grid; gap: 0.5rem; margin: 0.4rem 0 1rem; max-width: 48rem; }
    .cs-ul li { position: relative; padding-left: 1.4rem; font-size: 0.95rem; color: var(--soft); }
    .cs-ul li::before {
      content: ''; position: absolute; left: 0; top: 0.68em;
      width: 8px; height: 1px; background: var(--accent);
    }
    .cs-code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem; background: var(--ink); color: #C7D2FE;
      border-radius: var(--r); padding: 0.9rem 1.05rem;
      overflow-x: auto; white-space: nowrap; margin: 0.6rem 0 1.2rem;
      max-width: 48rem;
    }
    .cs-fig { margin: 1.2rem 0 1.7rem; }
    .cs-fig img {
      display: block; width: 100%; max-width: 720px;
      border: 1px solid var(--line-strong); border-radius: var(--r);
      cursor: zoom-in; background: var(--surface);
      transition: border-color 0.2s ease;
    }
    .cs-fig img:hover { border-color: var(--accent); }
    .cs-fig.small img { max-width: 380px; }
    .cs-cap {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.74rem; color: var(--muted); margin-top: 0.6rem;
      max-width: 720px; line-height: 1.55;
    }
    .cs-links { display: flex; flex-wrap: wrap; gap: 0.8rem; margin: 1.4rem 0 0.5rem; }
    .cs-note {
      font-size: 0.85rem; color: var(--muted);
      margin-top: 2rem; padding-top: 1.4rem; border-top: 1px solid var(--line);
    }
    .cs-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1.6rem; }
    .cs-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem; font-weight: 500;
      background: var(--accent-soft); color: var(--accent-ink);
      padding: 0.3rem 0.62rem; border-radius: 6px;
    }

    /* stacked screenshots */
    .cs-stack {
      position: relative; max-width: 720px;
      margin: 1.3rem 0 2.6rem; cursor: zoom-in;
      transition: transform 0.2s ease;
    }
    .cs-stack:hover { transform: translateY(-3px); }
    .cs-stack-layer {
      position: absolute; inset: 0;
      border: 1px solid var(--line-strong); border-radius: var(--r);
      background: var(--surface);
    }
    .cs-stack-layer.l3 { transform: translate(15px, 15px); opacity: 0.5; }
    .cs-stack-layer.l2 { transform: translate(8px, 8px); opacity: 0.8; }
    .cs-stack img {
      position: relative; display: block; width: 100%;
      border: 1px solid var(--line-strong); border-radius: var(--r);
      background: var(--surface);
    }
    .cs-stack-badge {
      position: absolute; right: 0.7rem; bottom: 0.7rem; z-index: 2;
      background: var(--ink); color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem; font-weight: 500;
      padding: 0.42rem 0.8rem; border-radius: 999px;
      display: flex; align-items: center; gap: 0.4rem;
    }

    /* ===== DESIGN GRID ===== */

    function Nav() {
      const [active, setActive] = useState('home');
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => {
          setScrolled(window.scrollY > 30);
          const pos = window.scrollY + 130;
          for (const id of NAV) {
            const el = document.getElementById(id);
            if (el && el.offsetTop <= pos && el.offsetTop + el.offsetHeight > pos) { setActive(id); break; }
          }
        };
        window.addEventListener('scroll', onScroll); onScroll();
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return h('nav', { className: 'nav' + (scrolled ? ' scrolled' : '') },
        h('div', { className: 'nav-inner' },
          h('ul', { className: 'nav-links' },
            NAV.map(item => h('li', { key: item },
              h('a', { href: '#' + item, className: active === item ? 'active' : '' },
                item.charAt(0).toUpperCase() + item.slice(1))
            ))
          )
        )
      );
    }

      const [open, setOpen] = useState(null);
      const [box, setBox] = useState(null);

      const stepImg = (d) => setBox(b => b && ({ items: b.items, i: (b.i + d + b.items.length) % b.items.length }));
      const openBox = (items, i) => setBox({ items: items, i: i || 0 });

      useEffect(() => {
        const onKey = (e) => {
          if (!box) return;
          if (e.key === 'Escape') setBox(null);
          if (e.key === 'ArrowRight') stepImg(1);
          if (e.key === 'ArrowLeft') stepImg(-1);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [box]);

      const block = (b, i) => {
        if (b.t === 'h') return h('h4', { className: 'cs-h', key: i }, b.v);
        if (b.t === 'sub') return h('div', { className: 'cs-sub', key: i }, b.v);
        if (b.t === 'p') return h('p', { className: 'cs-p', key: i }, b.v);
        if (b.t === 'code') return h('div', { className: 'cs-code', key: i }, b.v);
        if (b.t === 'ul') return h('ul', { className: 'cs-ul', key: i }, b.v.map((x, j) => h('li', { key: j }, x)));
        if (b.t === 'links') return h('div', { className: 'cs-links', key: i },
          b.v.map((l, j) => h('a', { key: j, href: l.href, target: '_blank', rel: 'noopener',
            className: 'btn ' + (j === 0 ? 'btn-primary' : 'btn-ghost') }, l.label)));
        if (b.t === 'fig') return h('figure', { className: 'cs-fig' + (b.small ? ' small' : ''), key: i },
          h('img', { src: b.src, alt: b.cap || '', loading: 'lazy', onClick: () => openBox([{ src: b.src, cap: b.cap }], 0) }),
          b.cap ? h('figcaption', { className: 'cs-cap' }, b.cap) : null);
        if (b.t === 'stack') return h('div', { className: 'cs-stack', key: i, onClick: () => openBox(b.v, 0) },
          h('div', { className: 'cs-stack-layer l3' }),
          h('div', { className: 'cs-stack-layer l2' }),
          h('img', { src: b.v[0].src, alt: b.v[0].cap || '', loading: 'lazy' }),
          h('span', { className: 'cs-stack-badge' }, '\u{1F5BC} ' + b.v.length + ' screenshots — click to view'));
        return null;
      };

      const workCard = (c, i) => {
        const isOpen = open === c.title;
        return h('article', { className: 'work' + (isOpen ? ' open' : ''), key: i },
          h('div', { className: 'work-thumb', onClick: () => openBox([{ src: c.thumb, cap: c.title }], 0) },
            h('img', { src: c.thumb, alt: c.title, loading: 'lazy' })
          ),
          h('div', { className: 'work-body' },
            h('div', null,
              h('div', { className: 'work-kicker' }, c.kicker),
              h('h3', { style: { marginTop: '0.35rem' } }, c.title)
            ),
            h('p', { className: 'work-sum' }, c.summary),
            h('div', { className: 'work-stats' },
              c.stats.map((st, j) => h('div', { className: 'work-stat', key: j },
                h('b', null, st[0]), h('span', null, st[1])))
            ),
            h('div', { className: 'work-flow' },
              c.flow.map((f, j) => h(F, { key: j },
                j > 0 ? h('i', null, '→') : null,
                h('span', null, f)))
            ),
            h('div', { className: 'cs-tags', style: { marginTop: 0 } },
              c.tags.map((t, j) => h('span', { className: 'cs-tag', key: j }, t))
            ),
            h('button', { className: 'work-more', onClick: () => setOpen(isOpen ? null : c.title) },
              isOpen ? '← Show less' : 'Read the full case study →'),
            isOpen ? h('div', { className: 'work-full' },
              c.blocks.map(block),
              c.note ? h('p', { className: 'cs-note' }, c.note) : null
            ) : null
          )
        );
      };

      const body = () => {
        if (cat === 'ghl') return h('div', { className: 'work-grid' },
          CASES.filter(c => c.featured).map(workCard));
        if (cat === 'auto') return h('div', { className: 'work-grid' },
          CASES.filter(c => !c.featured).map(workCard));
        if (cat === 'design') return h('div', { className: 'portfolio-grid' },
          DESIGNS.map((p, i) =>
            h('div', { className: 'design-card', key: i, onClick: () => openBox([{ src: p.src, cap: p.title + ' — ' + p.category }], 0) },
              h('div', { className: 'design-img-wrap' },
                h('img', { src: p.src, alt: p.title, className: 'design-img', loading: 'lazy' })),
              h('div', { className: 'design-info' }, h('h4', null, p.title), h('p', null, p.category))
            )
          ));
        return h('div', { className: 'sheets-grid' },
          SPREADSHEETS.map((sh, i) =>
            h('div', { className: 'sheet-card', key: i },
              h('div', { className: 'sheet-header' }, h('div', { className: 'sheet-icon' }, 'X'), h('h4', null, sh.title)),
              h('div', { className: 'sheet-body' },
                h('p', { className: 'sheet-desc' }, sh.desc),
                h('div', { className: 'sheet-preview' },
                  h('table', null,
                    h('thead', null, h('tr', null, sh.preview.headers.map((x, j) => h('th', { key: j }, x)))),
                    h('tbody', null, sh.preview.rows.map((row, j) =>
                      h('tr', { key: j }, row.map((cell, k) => h('td', { key: k }, cell)))))
                  )
                ),
                h('div', { className: 'sheet-tags' }, sh.tags.map((tg, j) => h('span', { className: 'sheet-tag', key: j }, tg))),
                h('a', { href: sh.file, target: '_blank', rel: 'noopener', className: 'sheet-download' }, '📊 View Spreadsheet')
              )
            )
          ));
      };

      const sub = {
        ghl: 'A full CRM system built in GoHighLevel. Start with the summary — open the case study if you want the whole build.',
        auto: 'Small automations that do one job well. Each card is the short version; open it for the full write-up, formulas and screenshots.',
        design: 'Social media ads and promotional designs across food, fashion, e-commerce, and health products. Click any design to see it bigger.',
        sheets: 'Data entry, formulas, pivot tables, and content planning. Click any card to open the live Google Sheet.',
      };

      return h(F, null,
        h('section', { id: 'portfolio', className: 'section' },
          h('div', { className: 'wrap' },
            h('div', { className: 'section-header' },
              h('span', { className: 'section-eyebrow' }, 'Portfolio'),
              h('h2', { className: 'section-title' }, 'Selected ', h('em', null, 'work')),
              h('p', { className: 'section-sub' }, sub[cat])
            ),
            h('div', { className: 'cs-tabs' },
              CATEGORIES.map(ct =>
                h('button', {
                  key: ct.key,
                  className: 'cs-tab' + (ct.key === cat ? ' on' : ''),
                  onClick: () => {
                    setCat(ct.key); setOpen(null);
                    const el = document.getElementById('portfolio');
                    if (el) window.scrollTo({ top: el.offsetTop - 60, behavior: 'smooth' });
                  },
                }, ct.label)
              )
            ),
            body()
          )
        ),
        box && h('div', { className: 'modal', onClick: () => setBox(null) },
          h('button', { className: 'modal-close', onClick: () => setBox(null), 'aria-label': 'Close' }, '×'),
          box.items.length > 1 && h('button', { className: 'modal-nav prev', 'aria-label': 'Previous',
            onClick: (e) => { e.stopPropagation(); stepImg(-1); } }, '\u2039'),
          box.items.length > 1 && h('button', { className: 'modal-nav next', 'aria-label': 'Next',
            onClick: (e) => { e.stopPropagation(); stepImg(1); } }, '\u203A'),
          h('div', { className: 'modal-fig', onClick: (e) => e.stopPropagation() },
            h('img', { src: box.items[box.i].src, alt: box.items[box.i].cap || '' }),
            box.items[box.i].cap ? h('p', { className: 'modal-cap' }, box.items[box.i].cap) : null,
            box.items.length > 1 ? h('span', { className: 'modal-count' }, (box.i + 1) + ' / ' + box.items.length) : null
          )
        )
      );
    }

    function Contact() {
      return h('section', { id: 'contact', className: 'contact' },
        h('span', { className: 'section-eyebrow' }, 'Let\'s connect'),
        h('h2', null, 'Have a project ', h('em', null, 'in mind?')),
        h('p', null, 'I\'d love to hear about it. Send me a message on any of the platforms below — I usually respond within a day.'),
        h('div', { className: 'contact-grid' },
          SOCIAL.map((s, i) =>
            h('a', { href: s.href, target: s.href.startsWith('http') ? '_blank' : null, rel: 'noopener', className: 'social-btn', key: i },
              s.icon
                ? h('img', { src: s.icon, className: 'social-icon-img', alt: '' })
                : h('span', { className: 'social-icon-emoji' }, s.emoji),
              h('span', { className: 'label' }, s.label),
              h('span', { className: 'value' }, s.value)
            )
          )
        )
      );
    }

    function App() {
      return h(F, null,
        h(Nav), h(Hero), h(About), h(Experience), h(Skills), h(Portfolio), h(Contact),
        h('footer', { className: 'footer' },
          '© 2026 Danielle Angelo Malixi · Built with ', h('span', null, 'React')
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
